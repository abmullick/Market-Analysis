services:
  - type: web
    name: market-analysis
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: STOXIM_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
