<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mutual Fund Analysis | Market Analysis</title>
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/features/mutual-fund-analysis.css">
</head>
<body>
    <header class="site-header">
        <div class="header-left">
            <img src="/static/images/m_analysis.png" alt="Market Analysis" class="logo">
            <h1>Mutual Fund Analysis</h1>
        </div>
        <nav id="main-nav"></nav>
    </header>
    <main class="container">
        <div id="mutual-fund-content">
            <div class="ranking-layout">
                <aside class="ranking-controls">
                    <h2>Ranking Controls</h2>
                    <div id="ranking-filters"></div>
                    <div id="ranking-screener"></div>
                    <div id="ranking-preset"></div>
                    <div id="ranking-criteria"></div>
                    <button id="run-ranking" class="btn btn-primary">Run Ranking</button>
                    <div id="ranking-methodology" class="methodology-box"></div>
                </aside>
                <section class="ranking-results">
                    <div id="ranking-summary"></div>
                    <div id="ranking-result-filters"></div>
                    <div id="ranking-table-container"></div>
                </section>
            </div>
        </div>
    </main>
    <script type="module" src="../js/core/config.js"></script>
    <script type="module" src="../js/core/navigation.js"></script>
    <script type="module" src="../js/core/utils.js"></script>
    <script type="module" src="../js/features/mutual-fund-analysis/index.js"></script>
    <script type="module" src="../js/pages/mutual-funds.js"></script>
</body>
</html>
