<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Analysis | Market Analysis</title>
    <link rel="icon" href="/static/images/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/features/stock-selection.css">
</head>
<body>
<header class="site-header">
    <div class="header-left">
        <img src="/static/images/logo.png" alt="Market Analysis" class="logo">
        <h1>Stock Analysis</h1>
    </div>
    <nav id="main-nav"></nav>
</header>

<main class="container">
    <div id="stock-analysis-content">
        <div class="pb-page-header-text">
            <h1 class="mf-page-title">Stock Analysis</h1>
            <p class="mf-page-subtitle">Fundamental analysis of individual stocks using Yahoo Finance data.</p>
        </div>

        <div class="stock-toolbar">
            <form id="stock-search-form" class="stock-search-form" autocomplete="off">
                <label class="sr-only" for="stock-symbol-input">Stock symbol</label>
                <input id="stock-symbol-input" name="symbol" type="text"
                       placeholder="RELIANCE.NS, TCS.NS, HDFCBANK.NS, AAPL"
                       spellcheck="false">
                <button type="submit" class="stock-page-btn">Analyze</button>
            </form>
            <div class="stock-help-text">NSE: <strong>.NS</strong> · BSE: <strong>.BO</strong></div>
        </div>

        <div id="stock-analysis-status" class="stock-analysis-status" aria-live="polite"></div>
        <div id="stock-details"></div>
    </div>
</main>

<a href="/help.html" class="help-link" title="Help & Methodology">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="10"></circle>
        <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
        <line x1="12" y1="17" x2="12.01" y2="17"></line>
    </svg>
    <span>Help & Methodology</span>
</a>

<footer class="site-footer">
    <div class="container">
        <p>&copy; 2026 Abhisek Basu Mullick. All rights reserved.</p>
    </div>
</footer>

<script type="module">
    import { initNavigation } from '/js/core/navigation.js';
    import { initStockAnalysis } from '/js/features/stock-selection/stock-detail/index.js';
    initNavigation();
    initStockAnalysis();
</script>
</body>
</html>
