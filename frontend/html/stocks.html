    </div>
    <nav id="main-nav"></nav>
</header>

<main class="container">
    <div id="stock-analysis-content">
        <div class="pb-page-header-text">
            <h1 class="mf-page-title">Stock Analysis</h1>
            <p class="mf-page-subtitle">Choose a stock first, then review its fundamental analysis.</p>
        </div>

        <div id="stock-selection-screen"></div>
        <div id="stock-analysis-screen" hidden>
            <button id="stock-back-to-selection" class="stock-back-btn" type="button">← Back to Stock Selection</button>

        </div>
    </div>
